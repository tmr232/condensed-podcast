minimum_prek_version = "0.5.11"

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "Ruff lint"
language = "system"
entry = "uv run --locked ruff check"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format"
language = "system"
entry = "uv run --locked ruff format --check"
types = ["python"]

[[repos.hooks]]
id = "ty"
name = "Type check Python"
language = "system"
entry = "uv run --locked ty check"
files = '\.py$|^pyproject\.toml$|^uv\.lock$'
pass_filenames = false

[[repos.hooks]]
id = "uv-lock"
name = "Check Python lockfile"
language = "system"
entry = "uv lock --check --offline"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "zizmor"
name = "Audit GitHub Actions"
language = "system"
entry = "uv run --locked zizmor --offline --strict-collection .github/workflows"
files = '^\.github/workflows/'
pass_filenames = false

[[repos.hooks]]
id = "actions-lock"
name = "Check GitHub Actions lockfile coverage"
language = "system"
entry = "gh actions-lock --verify-local"
files = '^\.github/workflows/'
pass_filenames = false
