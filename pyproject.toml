[project]
name = "condensed-podcast"
version = "0.1.0"
description = "A private, subtitle-condensed podcast for your tailnet"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "shuku==0.0.10",
    "tomlkit>=0.13,<1",
    "pywin32>=308; sys_platform == 'win32'",
    "typer>=0.29.2",
]

[project.scripts]
condensed-podcast = "condensed_podcast.cli:main"

[dependency-groups]
dev = [
    "prek>=0.5.11,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "ty>=0.0.107",
    "types-pywin32>=312.0.0.20261104",
    "zizmor>=1.32,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python-platform = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
