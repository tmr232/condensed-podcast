name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hooks, action locks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.15'
          enable-cache: false
      - run: uv sync --locked
      - name: Install action lockfile verifier
        run: gh extension install github/gh-actions-lock --pin v0.5.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run --locked prek run --all-files
      - name: Verify action lockfile provenance
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv build --out-dir "$RUNNER_TEMP/dist"

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.15'
          enable-cache: false
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - run: uv sync --locked
      - run: uv run --locked pytest -q
